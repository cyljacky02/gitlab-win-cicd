# TEMPORARY, UNAUTHENTICATED TRANSPORT SMOKE TEST ONLY.
# No GitLab Runner, no ADO agent, no source checkout, no credentials, no deployment.
# A successful run proves delivery/filtering only, NOT authenticated GitLab provenance.
# Delete the temporary GitLab webhook / ADO connection / pipeline after the test.
# Manual GitLab Test -> Push events probe: filter only event kind and project.
# No GitLab test branch or real push is required in this phase.
trigger: none
pr: none

name: webhook-smoke-$(Date:yyyyMMdd)$(Rev:.r)

resources:
  webhooks:
    - webhook: WebHook
      connection: gitlab-ado-smoke-rs
      filters:
        - path: object_kind
          value: push
        - path: project.path_with_namespace
          value: grp-smt-maint/Cathaysec.Com.Smt.Rayin

jobs:
  - job: WebhookReceived
    displayName: Transport probe only - no source, secrets, agents or deployment
    pool: server
    timeoutInMinutes: 1
    steps:
      - task: Delay@1
        displayName: Webhook probe reached ADO - zero-minute no-op
        inputs:
          delayForMinutes: '0'
